<title>ARUT Viral Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: control-room list of finds; tap a card → full-screen production sheet (hook, script, storyboard, caption, expert layer). Red = the red pill. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --raised:#eceef3; --ink:#12151d; --muted:#5b6172; --line:#d9dce5;
  --pill:#d42a3c; --pill-ink:#ffffff; --pill-soft:#fbe4e7; --blue:#2c5fd9; --blue-soft:#e3ebfc;
  --ok:#1f8a57; --ok-soft:#dff3e8; --warn:#b26a00; --warn-soft:#fbefd9;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1017; --surface:#151a24; --raised:#1c2230; --ink:#eef0f5; --muted:#9aa1b2; --line:#2a3141;
  --pill:#ff4d5e; --pill-ink:#14070a; --pill-soft:#3a1820; --blue:#7aa2ff; --blue-soft:#1b2747;
  --ok:#4cc98a; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1017; --surface:#151a24; --raised:#1c2230; --ink:#eef0f5; --muted:#9aa1b2; --line:#2a3141;
  --pill:#ff4d5e; --pill-ink:#14070a; --pill-soft:#3a1820; --blue:#7aa2ff; --blue-soft:#1b2747;
  --ok:#4cc98a; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#33270f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:grid;gap:14px;padding-bottom:6px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5vw,32px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand h1 b{color:var(--pill)}
.meta{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .n{color:inherit;opacity:.7}
.tab.red[aria-selected="true"]{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.lede{color:var(--muted);max-width:68ch;margin:14px 0 4px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.views{font-family:var(--f-mono);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.views small{display:block;font:500 11px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.era{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.15;color:var(--pill)}
.card h3{margin:0;font:600 17px/1.3 var(--f-body);text-wrap:balance}
.sub{color:var(--muted);font-size:13px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.why{margin:0;color:var(--ink);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted)}
.status{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap}
.st-new{background:var(--blue-soft);color:var(--blue)}
.st-work{background:var(--warn-soft);color:var(--warn)}
.st-shot{background:var(--ok-soft);color:var(--ok)}
.actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);margin-top:14px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-head .inner{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:grid;gap:10px}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-title{font:700 18px/1.25 var(--f-display);margin:0;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].s-new{background:var(--blue-soft);color:var(--blue)}
.seg button[aria-pressed="true"].s-work{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"].s-shot{background:var(--ok-soft);color:var(--ok)}
.jump{display:flex;gap:6px;overflow-x:auto}
.jump a{flex:0 0 auto;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sheet-body{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:grid;gap:26px}
section.block{display:grid;gap:10px;min-width:0;scroll-margin-top:150px}
.label{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hook{font:700 clamp(20px,4.6vw,30px)/1.2 var(--f-display);margin:0;text-wrap:balance}
.concept{font-size:16px;max-width:68ch;margin:0}
.fmt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.script{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.line{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .t{font-family:var(--f-mono);font-size:12px;color:var(--pill);padding-top:2px;font-variant-numeric:tabular-nums}
.line .x{min-width:0}
.shots{display:grid;gap:12px}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:44px 1fr;gap:12px;min-width:0}
.shot .num{font:700 20px var(--f-mono);color:var(--pill);line-height:1}
.shot .num small{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-top:6px}
.shot .body{display:grid;gap:8px;min-width:0}
.ovl{font:600 13px var(--f-body);background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:6px;justify-self:start}
.prompt{font-family:var(--f-mono);font-size:12.5px;background:var(--raised);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.caption{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;font-family:var(--f-body)}
.kw{font:700 15px var(--f-mono);color:var(--pill)}
ul.list{margin:0;padding-left:20px;display:grid;gap:6px;max-width:72ch}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.exp div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.exp h4{margin:0 0 6px;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.exp p{margin:0;font-size:14px}
.risk{background:var(--pill-soft);border-radius:var(--r);padding:14px}
.risk ul{margin:0;padding-left:20px;display:grid;gap:6px}
.distr{border-left:3px solid var(--pill);padding:4px 0 4px 14px;font-size:16px;margin:0;max-width:68ch}
.src{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30}
.addbar{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 220px;min-width:0}
input.f,textarea.f{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea.f{min-height:96px;resize:vertical;line-height:1.45}
input.f:focus-visible,textarea.f:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.queue{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.q{background:var(--raised);border-radius:8px;padding:3px 8px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q.done{color:var(--ok)} .q.error{color:var(--pill)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools input{flex:1 1 200px;min-width:0}
.tools select{font:600 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.variants{display:flex;gap:6px;flex-wrap:wrap}
.variants button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 12px var(--f-body);border-radius:999px;padding:5px 11px;cursor:pointer}
.variants button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ai-out{font-size:13px;color:var(--muted)}
.persona{display:grid;gap:16px;max-width:760px;margin-top:14px}
.persona label{display:grid;gap:6px;font-weight:600}
.persona .hint{font-weight:400;color:var(--muted);font-size:13px}
@media (max-width:520px){.line{grid-template-columns:54px 1fr}.views{font-size:24px}.sh-top{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
</style>

<style>
.langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.sh-top .langs{margin-left:auto;margin-right:8px}
.langs button{border:0;background:var(--surface);color:var(--muted);font:700 12px var(--f-mono);padding:6px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.brand{width:100%}
/* storyboard filmstrip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.panel{flex:0 0 auto;width:min(42vw,168px);display:grid;gap:6px;scroll-snap-align:start;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit}
.frame{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:12px;overflow:hidden;background:var(--raised);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .fx{position:absolute;inset:0}
.frame .tl{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font:700 10px var(--f-mono);letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.frame .num{font:700 22px var(--f-mono);color:#fff}
.frame .ovtext{position:absolute;left:8px;right:8px;bottom:30px;text-align:center;font:700 12px/1.2 var(--f-body);color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:5px 6px;text-wrap:balance}
.frame .cam{position:absolute;left:8px;bottom:8px;font:600 10px var(--f-mono);color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.frame .dur{position:absolute;right:8px;bottom:8px;font:700 10px var(--f-mono);color:#fff;background:rgba(0,0,0,.45);border-radius:4px;padding:1px 5px}
.frame .glyph{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.panel .cap{font-size:12px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.panel:focus-visible .frame{outline:2px solid var(--blue);outline-offset:2px}
.mini{display:flex;gap:4px;overflow:hidden;border-radius:8px}
.mini .m{flex:1 1 0;min-width:0;aspect-ratio:9/16;max-height:72px;border-radius:5px;position:relative;overflow:hidden}
.mini .m img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .thumb{width:44px}
.shot .thumb .frame{border-radius:8px}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.upl label.btn{cursor:pointer}
.upl input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.legend{font-size:12px;color:var(--muted)}
.lang-note{font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>ARUT <b>Viral</b> Radar</h1><span class="meta" id="meta"></span>
      <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="ru" aria-pressed="true">RU</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
    </div>
    <form class="addbar" id="addform" autocomplete="off">
      <label for="addurl" class="label" data-t="addLabel"></label>
      <div class="addrow">
        <input class="f" id="addurl" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/…" required>
        <input class="f" id="addnote" type="text" data-tp="addNote">
        <button class="btn primary" type="submit" data-t="addBtn"></button>
      </div>
      <div class="queue" id="queue"></div>
    </form>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" aria-selected="true" data-tab="reels"><span data-t="tabReels"></span> <span class="n" id="n-reels">0</span></button>
    <button class="tab red" role="tab" aria-selected="false" data-tab="redpill">Red Pill <span class="n" id="n-redpill">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="work"><span data-t="tabWork"></span> <span class="n" id="n-work">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="shot"><span data-t="tabShot"></span> <span class="n" id="n-shot">0</span></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="persona" data-t="tabPersona"></button>
  </nav>
  <p class="lede" id="lede"></p>
  <div class="tools" id="tools">
    <input class="f" id="search" type="search" data-tp="search">
    <select id="sort" aria-label="Sort"><option value="views" data-t="sortViews"></option><option value="new" data-t="sortNew"></option></select>
  </div>
  <main id="list" class="grid" aria-live="polite"></main>
  <div id="empty" class="empty" hidden></div>
  <form class="persona" id="persona" hidden autocomplete="off">
    <label for="p-facts"><span data-t="pFacts"></span>
      <span class="hint" data-t="pFactsHint"></span>
      <textarea class="f" id="p-facts" rows="7"></textarea></label>
    <label for="p-voice"><span data-t="pVoice"></span>
      <span class="hint" data-t="pVoiceHint"></span>
      <textarea class="f" id="p-voice" rows="4"></textarea></label>
    <label for="p-taboo"><span data-t="pTaboo"></span>
      <span class="hint" data-t="pTabooHint"></span>
      <textarea class="f" id="p-taboo" rows="3"></textarea></label>
    <div><button class="btn primary" type="submit" data-t="pSave"></button></div>
  </form>
</div>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden>
  <div class="sheet-head"><div class="inner">
    <div class="sh-top">
      <button class="btn small" id="close" type="button" data-t="back"></button>
      <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="ru" aria-pressed="true">RU</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Status">
        <button type="button" class="s-new" data-st="new" aria-pressed="false" data-t="stNew"></button>
        <button type="button" class="s-work" data-st="work" aria-pressed="false" data-t="stWork"></button>
        <button type="button" class="s-shot" data-st="shot" aria-pressed="false" data-t="stShot"></button>
      </div>
    </div>
    <h2 class="sh-title" id="sh-title"></h2>
    <nav class="jump" id="jump" aria-label="Adaptation sections"></nav>
  </div></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div id="toast" class="toast" hidden></div>

ru:{addLabel:"Нашёл ролик сам? Вставь ссылку, и радар разберёт его в ближайший запуск",addNote:"Что зацепило или какой поворот хочешь (необязательно)",addBtn:"В очередь",
 tabReels:"Залёты",tabWork:"В работе",tabShot:"Снято",tabPersona:"Персонаж",search:"Поиск по названию, автору, ключу",sortViews:"По просмотрам",sortNew:"Сначала новые",
 pFacts:"Реальные факты обо мне",pFactsHint:"Возраст, город детства, первые шаги в музыке и трейдинге, реальные цифры и даты. Радар и кнопка «Переписать» подставляют их вместо пропусков [в скобках] и никогда не выдумывают биографию.",

  const vbar=state.draft?`<div class="variants"><button type="button" aria-pressed="true">${t("draft")}</button></div>
      <div class="actions"><button class="btn primary" type="button" id="save-draft">${t("saveVar")}</button><button class="btn" type="button" id="drop-draft">${t("cancel")}</button></div>`
    :names.length>1?`<div class="variants">${names.map((n,i)=>`<button type="button" data-variant="${i}" aria-pressed="${i===state.variant}">${esc(n)}</button>`).join("")}</div>`:"";
  const idea=state.draft?.idea||(d.variants||[])[state.variant-1]?.idea;
  /* 1. storyboard first */
  add("board",t("sBoard"),`<div class="label">${t("sBoard")} · ${(a.storyboard||[]).length} ${t("frames")} ${copyBtn((a.storyboard||[]).map(s=>`#${s.n} (${s.dur}) ${s.prompt}`).join("\n\n"),t("allPrompts"))}</div>
    ${vbar}${idea?`<div class="ai-out">${t("yourIdea")}: ${esc(idea)}</div>`:""}
    <p class="hook">${esc(a.hook)}</p>
    <div class="strip">${(a.storyboard||[]).map((s,i)=>`<button type="button" class="panel" data-goshot="${esc(s.n)}">${frameHTML(d,s,i)}<span class="cap">${esc(s.frame)}</span></button>`).join("")}</div>
    <p class="legend">${t("boardHint")}</p>${hasLang?"":`<p class="lang-note">${t("fallbackLang")}</p>`}`);
  if(d.kind==="reel"){
    add("src",t("sWhy"),`<div class="label">${t("sWhy")} <a class="btn small" href="${esc(d.source?.url)}" target="_blank" rel="noopener">${t("orig")}</a></div>
      <div class="sub">@${esc(d.source?.author)} · ${fmtN(d.source?.views)} ${t("views")} · ♥ ${fmtN(d.source?.likes)} · 💬 ${fmtN(d.source?.comments)} · ${esc(fmtD(d.source?.date))}</div>
      <ul class="list">${(lf(d,"why")||[]).map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`);
  }else{
    add("facts",t("sFacts"),`<div class="label">${t("distr")}</div><p class="distr">${esc(lf(d,"distraction"))}</p>
      <div class="label">${t("facts")}</div><ul class="list">${(lf(d,"facts")||[]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <div class="src"><b>${t("sources")}:</b> ${(lf(d,"sources")||[]).map(esc).join(" · ")}</div>`);
  }
  add("hook",t("sHook"),`<div class="label">${t("hookIdea")} ${copyBtn(a.hook)}</div><p class="hook">${esc(a.hook)}</p><p class="concept">${esc(a.concept)}</p><div class="fmt">${esc(a.format)}</div>`);
  add("script",t("sScript"),`<div class="label">${t("scriptLbl")} ${copyBtn(fullScript,t("copyAll"))}</div>
    <div class="script">${vo.map(l=>`<div class="line"><span class="t">${esc(l.t)} ${state.lang==="en"?"s":"с"}</span><span class="x">${esc(l.text)}</span></div>`).join("")}</div>`);
  add("shots",t("sShots"),`<div class="label">${t("sShots")}</div>
    <div class="shots">${(a.storyboard||[]).map((s,i)=>{const key=`${state.variantKey}-${s.n}`;const has=(d.frames||{})[key];return`<div class="shot" id="shot-${esc(s.n)}"><div class="thumb">${frameHTML(d,s,i,{mini:true})}</div><div class="body">
      <div><b>${esc(s.n)} · ${esc(fdur(s.dur))}</b> — ${esc(s.frame)}</div>${s.overlay?`<span class="ovl">${esc(s.overlay)}</span>`:""}
      <div class="prompt">${esc(s.prompt)}</div>
      <div class="upl">${copyBtn(s.prompt,t("copyPrompt"))}${assets&&state.canWrite?`<label class="btn small">${has?t("replace"):t("upload")}<input type="file" accept="image/*" data-frame="${esc(key)}"></label>${has?`<button class="btn small" type="button" data-unframe="${esc(key)}">${t("removeF")}</button>`:""}`:""}</div></div></div>`}).join("")}</div>
    <p class="note">${t("charRef")}</p>`);
  add("caption",t("sCaption"),`<div class="label">${t("captionLbl")} ${copyBtn(a.caption)}</div><pre class="caption">${esc(a.caption)}</pre>
    <div>${t("keyword")}: <span class="kw">${esc(a.keyword)}</span></div>${a.cta?`<p class="concept">${esc(a.cta)}</p>`:""}
    ${a.prompt_gift?`<div class="label">${t("gift")} ${copyBtn(a.prompt_gift)}</div><div class="prompt">${esc(a.prompt_gift)}</div>`:""}`);
  const e=lexp(d);
  add("expert",t("sExpert"),`<div class="label">${t("expert")}</div><div class="exp">
    <div><h4>${t("mk")}</h4><p>${esc(e.markets)}</p></div><div><h4>${t("mc")}</h4><p>${esc(e.macro)}</p></div><div><h4>${t("pol")}</h4><p>${esc(e.politics)}</p></div></div>`);
  const risks=lf(d,"risks")||[];
  if(risks.length)add("risks",t("sRisks"),`<div class="label">${t("checkBefore")}</div><div class="risk"><ul>${risks.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>${lf(d,"note")?`<p class="note">${esc(lf(d,"note"))}</p>`:""}`);
  if(sample)add("mine",t("sMine"),`<div class="label">${t("rewriteLbl")}</div>
    <textarea class="f" id="idea" rows="3" placeholder="${esc(t("ideaPh"))}"></textarea>
    <div class="actions"><button class="btn primary" type="button" id="rewrite">${t("rewrite")}</button><button class="btn" type="button" id="stop" hidden>${t("stop")}</button></div>
    <div class="ai-out" id="ai-out">${t("aiHint")}</div>`);
  add("notes",t("sNotes"),`<div class="label">${t("notesLbl")}</div>
    <textarea class="f" id="notes" rows="4" placeholder="${esc(t("notesPh"))}">${esc(d.notes||"")}</textarea>
    <div><button class="btn" type="button" id="save-notes"${state.canWrite?"":" disabled"}>${t("saveNote")}</button></div>`);
  $("#jump").innerHTML=jump.join("");
  $("#sheet-body").innerHTML=sections.join("");
}
function openSheet(kind,id){state.open=[kind==="reel"?"reel":"redpill",id];state.variant=0;state.draft=null;renderSheet();$("#sheet").hidden=false;$("#sheet").scrollTop=0;document.body.style.overflow="hidden";$("#close").focus();try{history.replaceState(null,"","#"+id)}catch(_){}}
function closeSheet(){aiCtl?.abort();state.open=null;state.draft=null;$("#sheet").hidden=true;document.body.style.overflow="";try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}}
let tt;function toast(m){const x=$("#toast");x.textContent=m;x.hidden=false;clearTimeout(tt);tt=setTimeout(()=>x.hidden=true,2000)}
async function save(col,id,patch){if(!db)throw{code:"unavailable"};try{await db.doc(`${col}/${id}`).update(patch)}catch(e){if(e&&e.code==="invalid_argument")state.canWrite=false;throw e}}
function reelIdFromUrl(u){const m=/instagram\.com\/(?:[^/]+\/)?reels?\/([A-Za-z0-9_-]+)/.exec(u);return m?m[1]:null}
const LOC_SHAPE=`{"concept": string, "format": string, "hook": string, "vo": [{"t": "0–3", "text": string}], "storyboard": [{"frame": string, "overlay": string}], "caption": string, "keyword": string, "cta": string}`;
async function rewrite(){
  const[kind,id]=state.open;const d=find(kind,id);const idea=$("#idea").value.trim();
  if(!idea){toast(t("tIdea"));return}
  const out=$("#ai-out"),btn=$("#rewrite"),stop=$("#stop");
  aiCtl=new AbortController();btn.disabled=true;stop.hidden=false;out.textContent=t("aiThinking");
  const p=state.persona||{};
  const cur=adaptationOf(d,state.variant);
  const prompt=`You are the screenwriter, short-form video director, professional trader, macro analyst and political scientist behind ARUT (Arut Nazaryan): 38, Dubai, media personality, three-time platinum recording artist, investor and crypto/forex trader, founder of ARUT ACADEMY (100K+ students), 3.8M Instagram followers, husband and father of two, boxing, fitness, AI, longevity. Tagline: "One name. Many worlds. I AM ARUT."

Real facts about Arut (use only these for anything personal; if a personal detail is needed and missing, write [real fact] / [реальный факт]):
${p.facts||"(not filled yet)"}
His voice: ${p.voice||"short sentences, confident, pop culture, sharp humor, never insulting"}
Never use: ${p.taboo||"other brands' logos, movie characters, real public figures in frame, children's faces, income promises, invented biography"}

Source ${d.kind==="reel"?"viral reel":"documented story"}: ${d.title}. ${d.kind==="reel"?`@${d.source?.author}, ${d.source?.views} views. Why it went viral: ${(d.why||[]).join(" ")}`:`Facts: ${(d.facts||[]).join(" ")} Sources: ${(d.sources||[]).join("; ")}`}

Current adaptation (JSON):
${JSON.stringify({...cur,storyboard:(cur.storyboard||[]).map(s=>({n:s.n,dur:s.dur,frame:s.frame,overlay:s.overlay,prompt:s.prompt}))})}

Arut's request for a new version: ${idea}

Write the new version in BOTH languages. Russian: native Russian creator voice on "ты", punchy, modern, no calques. English: natural, punchy. Keep facts accurate and do not invent numbers. Storyboard prompts are in English only and must contain [ARUT character reference] where Arut appears. The Russian keyword is one Russian word in caps used in the Russian caption; the English keyword is one English word in caps.
Reply with only one JSON object: {"shots": [{"n": 1, "dur": "3 с", "prompt": string}], "en": ${LOC_SHAPE}, "ru": ${LOC_SHAPE}}. The "storyboard" arrays in "en" and "ru" have the same length and order as "shots".`;
  try{
    const res=await sample.json(prompt,{signal:aiCtl.signal,cache:false,onText:()=>{out.textContent=t("aiWriting")}});
    if(!res||!Array.isArray(res.shots)||!res.en?.hook||!res.ru?.hook)throw{code:"invalid_json"};
    const base={...res.en,storyboard:res.shots.map((s,i)=>({n:s.n??i+1,dur:s.dur||"",prompt:s.prompt||"",frame:res.en.storyboard?.[i]?.frame||"",overlay:res.en.storyboard?.[i]?.overlay||""}))};
    state.draft={idea,adaptation:base,i18n:{en:{adaptation:res.en},ru:{adaptation:res.ru}}};
    document.activeElement?.blur?.();renderSheet();$("#sheet").scrollTop=0;toast(t("tVarReady"));
  }catch(e){
    out.textContent=t("aiErr")[e?.code]||t("aiErrDefault");
    if(e?.code==="not_granted"||e?.code==="sampling_disabled")sample=null;
  }finally{btn&&(btn.disabled=false);stop&&(stop.hidden=true);aiCtl=null}
}
document.addEventListener("click",async ev=>{
  const lb=ev.target.closest("[data-lang]");if(lb){state.lang=lb.dataset.lang;try{localStorage.setItem("radar-lang",state.lang)}catch(_){}render();return}
  const tab=ev.target.closest(".tab");if(tab){state.tab=tab.dataset.tab;render();return}
  const o=ev.target.closest("[data-open]");if(o){const[k,i]=o.dataset.open.split("|");openSheet(k,i);return}
  if(ev.target.closest("#close")){closeSheet();return}
  const j=ev.target.closest(".jump a");if(j){ev.preventDefault();document.querySelector(j.getAttribute("href"))?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const gs=ev.target.closest("[data-goshot]");if(gs){document.getElementById("shot-"+gs.dataset.goshot)?.scrollIntoView({behavior:"smooth",block:"center"});return}
  const c=ev.target.closest("[data-copy]");if(c){try{await navigator.clipboard.writeText(c.dataset.copy);toast(t("tCopied"))}catch(_){const p=c.closest(".block,.shot")?.querySelector(".prompt,.caption,.hook");if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast(t("tCopyManual"))}return}
  const v=ev.target.closest("[data-variant]");if(v){state.variant=+v.dataset.variant;renderSheet();return}
  if(ev.target.closest("#rewrite")){rewrite();return}
  if(ev.target.closest("#stop")){aiCtl?.abort();return}
  if(ev.target.closest("#drop-draft")){state.draft=null;renderSheet();return}
  if(ev.target.closest("#save-draft")&&state.open&&state.draft){
    const[kind,id]=state.open;const d=find(kind,id);
    const variants=[...(d.variants||[]),{idea:state.draft.idea,createdAt:new Date().toISOString(),adaptation:state.draft.adaptation,i18n:state.draft.i18n}];
    try{await save(colOf(kind),id,{variants});d.variants=variants;state.variant=variants.length;state.draft=null;renderSheet();toast(t("tVar"))}catch(_){toast(t("tVarErr"))}
    return}
  const uf=ev.target.closest("[data-unframe]");if(uf&&state.open){
    const[kind,id]=state.open;const d=find(kind,id);
    try{await save(colOf(kind),id,{frames:{[uf.dataset.unframe]:{__delete__:true}}});if(d.frames)delete d.frames[uf.dataset.unframe];renderSheet()}catch(_){toast(t("tSaveErr"))}
    return}
  if(ev.target.closest("#save-notes")&&state.open){
    const[kind,id]=state.open;const d=find(kind,id);const notes=$("#notes").value;
    try{await save(colOf(kind),id,{notes});d.notes=notes;toast(t("tNote"))}catch(_){toast(t("tNoteErr"))}
    return}
  const sb=ev.target.closest(".seg button");if(sb&&state.open&&db){
    const[kind,id]=state.open;const d=find(kind,id);
    if(!d||d.status===sb.dataset.st)return;
    const prev=d.status;d.status=sb.dataset.st;render();
    try{await save(colOf(kind),id,{status:sb.dataset.st,statusAt:new Date().toISOString()});toast(sb.dataset.st==="shot"?t("tShot"):sb.dataset.st==="work"?t("tWork"):t("tNew"))}
    catch(_){d.status=prev;render();toast(t("tStatusErr"))}
  }
});
document.addEventListener("change",async ev=>{
  const inp=ev.target.closest("input[type=file][data-frame]");if(!inp||!state.open||!assets)return;
  const file=inp.files&&inp.files[0];if(!file)return;
  const key=inp.dataset.frame;if(key.startsWith("d-")){toast(t("tFrameErr"));return}
  const[kind,id]=state.open;const d=find(kind,id);
  const lbl=inp.closest("label");if(lbl)lbl.firstChild.textContent=t("uploading");
  try{const r=await assets.upload(file);await save(colOf(kind),id,{frames:{[key]:r.id}});d.frames={...(d.frames||{}),[key]:r.id};renderSheet();toast(t("tFrame"))}
  catch(_){toast(t("tFrameErr"));renderSheet()}
});
$("#search").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#sort").addEventListener("change",e=>{state.sort=e.target.value;render()});
$("#addform").addEventListener("submit",async e=>{
  e.preventDefault();
  const url=$("#addurl").value.trim(),note=$("#addnote").value.trim();
  const rid=reelIdFromUrl(url);
  if(!rid){toast(t("tNeedReel"));return}
  if(all().some(d=>d.id===rid)){toast(t("tInDb"));return}
  if(!db){toast(t("tNoDb"));return}
  try{await db.doc(`queue/${rid}`).set({url:url.split("?")[0],note,addedAt:new Date().toISOString(),status:"pending"});$("#addurl").value="";$("#addnote").value="";toast(t("tAdded"))}
  catch(_){toast(t("tAddErr"))}
});
$("#persona").addEventListener("submit",async e=>{
  e.preventDefault();if(!db){toast(t("tNoDb"));return}
  const data={facts:$("#p-facts").value,voice:$("#p-voice").value,taboo:$("#p-taboo").value,updatedAt:new Date().toISOString()};
  try{await db.doc("config/persona").set(data);state.persona=data;toast(t("tPersona"))}catch(_){toast(t("tSaveErr"))}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.open)closeSheet()});
render();
(async()=>{
  try{db=await window.claude?.use?.("db")}catch(_){db=null}
  try{sample=await window.claude?.use?.("sample")}catch(_){sample=null}
  try{assets=await window.claude?.use?.("assets")}catch(_){assets=null}
  if(!db){render();return}
  try{const u=await window.claude.use("user");const c=u?await u.can("data.write"):null;if(c===false)state.canWrite=false}catch(_){}
  for(const col of["reels","redpill"]){
    db.collection(col).onSnapshot(snap=>{
      state[col]=snap.docs.map(s=>({...s.data(),id:s.id}));state.loaded[col]=true;render();
      const h=location.hash.slice(1);if(h&&!state.open){const d=find(col==="reels"?"reel":"redpill",h);if(d)openSheet(d.kind,d.id)}
    },()=>{state.loaded[col]=true;render()});
  }
  db.collection("queue").onSnapshot(snap=>{state.queue=snap.docs.map(s=>({...s.data(),id:s.id}));renderQueue()},()=>{});
  db.doc("config/persona").onSnapshot(s=>{state.persona=s.exists?s.data():{};if(state.tab==="persona")fillPersona()},()=>{});
  if(assets&&state.open)renderSheet();
})();
</script>
