name: Find afxspainbot token (one-off check)
on:
  push:
    branches: [claude/project-thread-lyq11t]
    paths: [.github/workflows/find-bot.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: getMe for every secret that looks like a bot token (prints names, never values)
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          def tg(tok, m):
              try:
                  return json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{tok}/{m}", timeout=20))
              except Exception as e:
                  return {"ok": False, "err": type(e).__name__}
          s = json.loads(os.environ["ALL"])
          for name, val in sorted(s.items()):
              val = (val or "").strip()
              if not re.fullmatch(r"\d{6,12}:[A-Za-z0-9_-]{30,}", val):
                  continue
              me = tg(val, "getMe")
              user = me.get("result", {}).get("username") if me.get("ok") else None
              print(f"{name}: {'@'+user if user else 'INVALID'}")
              if user and "spain" in user.lower():
                  wh = tg(val, "getWebhookInfo").get("result", {})
                  print(f"  webhook set: {bool(wh.get('url'))}, pending: {wh.get('pending_update_count')}")
                  up = tg(val, "getUpdates")
                  chats = {}
                  for u in up.get("result", []):
                      for k in ("message", "channel_post", "my_chat_member", "edited_message", "chat_member"):
                          c = (u.get(k) or {}).get("chat")
                          if c: chats[c["id"]] = (c.get("type"), c.get("title") or c.get("username"), c.get("is_forum"))
                  for cid, v in chats.items():
                      print(f"  chat {cid}: {v}")
                      st = tg(val, f"getChatMember?chat_id={cid}&user_id={me['result']['id']}")
                      print(f"    bot status: {st.get('result', {}).get('status')}")
          PY
